<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>

  <h1>On A Roll </h1>

  <form id="loginForm">
    <input
      type="email"
      id="email"
      placeholder="Email"
      required
    />

    <input
      type="password"
      id="password"
      placeholder="Password"
      required
    />

    <button type="submit">Log In here</button>
  </form>

<p>
  Don’t have an account?
  <a href="signup.html">Sign up</a>
</p>


  <p id="error"></p>

  <script src="auth.js"></script>
</body>
</html>
