<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign Up</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>

  <h1>Create Account 🥋</h1>

  <form id="signupForm">
    <input
      type="text"
      id="username"
      placeholder="Username"
      required
    />

    <input
      type="email"
      id="email"
      placeholder="Email"
      required
    />

    <input
      type="password"
      id="password"
      placeholder="Password"
      required
    />

    <button type="submit">Sign Up</button>
  </form>

  <p id="error"></p>

  <p>
    Already have an account?
    <a href="index.html">Log in</a>
  </p>

  <script src="auth.js"></script>
</body>
</html>
